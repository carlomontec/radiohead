# Radiohead "House of Cards" 3D Video Export Configuration

[video]
resolution = [1080, 1920]          # [Width, Height] - Vertical Full HD for mobile / Reels
framerate = 30                     # Target FPS (30 FPS matches the 70s audio sample)
start_frame = 1                    # Start frame (1 to 2101)
end_frame = 2101                   # End frame (full song performance)
output_path = "exports/radiohead_house_of_cards_vertical.mp4"
audio_path = "data/HouseOfCards_DataSample.mp3"
include_audio = true

[camera]
mode = "orbit"                     # "orbit", "portrait_3_4_drift", or "fixed"
azimuth = 1.32                     # Starting angle (multiplied by pi)
elevation = -0.01                  # Vertical eye-level pitch (multiplied by pi)
perspectiveness = 1.0              # Full 3D perspective depth (1.0 = maximum optical 3D depth)
zoom_half_width = 72.0             # Tight close-up zoom (Option 3A framing)
orbit_speed_seconds = 60.0         # 1 full 360-degree rotation in 60 seconds (1 minute)
orbit_direction = "counter_clockwise" # "counter_clockwise" or "clockwise"
drift_amplitude = 0.06             # Used if mode is "portrait_3_4_drift"

[rendering]
colormap = "turbo"                 # "turbo", "viridis", "plasma", "ice", "coolwarm", "inferno"
colorrange = [20.0, 220.0]         # Min and Max intensity color bounds
markersize = 7.0                   # Point size in pixels
min_intensity = 18.0               # Minimum laser reflection threshold (filters noise)
background_color = [0.012, 0.012, 0.020] # Background RGB [0.0 - 1.0]

[title]
show = true                        # Set to false for a clean look without title
text = "RADIOHEAD // HOUSE OF CARDS (remake by @zurdo_visuals)"
font = "Helvetica Bold"            # Font family / style
fontsize = 28                      # Font size
color = [0.85, 0.85, 0.95]         # Title RGB color
